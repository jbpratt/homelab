apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-fstrim
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.4.0
    systemd:
      units:
        # Weekly TRIM; the DRAM-less SATA SSDs degrade badly without it.
        - name: fstrim.timer
          enabled: true
